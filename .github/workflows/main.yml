name: RDP

on:
  workflow_dispatch:

permissions: {}

jobs:
  secure-rdp:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Configure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "Set the RDP_PASSWORD repository secret."
          }

          # Check Tailscale
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
              throw "Tailscale is not installed."
          }

          $ip = (& $tsExe ip -4 | Select-Object -First 1).Trim()

          if (-not $ip) {
              throw "Tailscale is not connected."
          }

          # Enable Remote Desktop; keep NLA enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          # Create or update the RDP user
          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($user) {
              Set-LocalUser -Name 'RDP' -Password $securePass
              Enable-LocalUser -Name 'RDP'
          }
          else {
              New-LocalUser `
                -Name 'RDP' `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description 'Remote Desktop user'
          }

          # Add the user to Remote Desktop Users
          $group = Get-LocalGroup -SID 'S-1-5-32-555'
          $user = Get-LocalUser -Name 'RDP'
          $members = @(
              Get-LocalGroupMember -Group $group.Name `
                -ErrorAction SilentlyContinue
          )

          if (-not ($members | Where-Object {
              $_.SID.Value -eq $user.SID.Value
          })) {
              Add-LocalGroupMember `
                -Group $group.Name `
                -Member 'RDP'
          }

          # Allow RDP only from Tailscale IPv4 addresses
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale-only' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale-only' `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Action Allow `
            -Profile Any

          Set-Service -Name TermService -StartupType Automatic

          if ((Get-Service TermService).Status -ne 'Running') {
              Start-Service -Name TermService
          }

          # Kali Linux command: full screen, password prompt
          $rdpCommand = "xfreerdp3 /v:$ip /u:RDP /f /dynamic-resolution"

          Write-Host ""
          Write-Host "========== RDP ACCESS =========="
          Write-Host "Address:  $ip"
          Write-Host "Username: RDP"
          Write-Host "Password: Configured in secret RDP_PASSWORD"
          Write-Host ""
          Write-Host "Kali Linux command:"
          Write-Host $rdpCommand
          Write-Host "================================"

          @"
          ## RDP ACCESS

          - Address: $ip
          - Username: RDP
          - Password: Stored in repository secret `RDP_PASSWORD`

          ### Kali Linux — Full Screen

          ````bash
          $rdpCommand
          ````

          Enter the secret password when prompted.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
