      - name: Maintain Connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $ip = $env:TAILSCALE_IP.Trim()
          $password = $env:RDP_PASSWORD

          if (-not $ip -or -not $password) {
              throw "RDP IP or password is missing."
          }

          # Safely quote the password for Kali Bash
          $bashPassword = $password.Replace("'", "'\''")

          $rdpCommand = "xfreerdp3 /v:$ip /u:RDP /p:'$bashPassword' /f -decorations /cert:ignore"

          Write-Host ""
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address: $ip"
          Write-Host "Username: RDP"
          Write-Host "Password: [configured]"
          Write-Host ""
          Write-Host "Copy this command to Kali Linux:"
          Write-Host $rdpCommand
          Write-Host "=================="

          while ($true) {
              Start-Sleep -Seconds 300
          }
